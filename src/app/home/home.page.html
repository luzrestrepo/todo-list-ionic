<ion-header>
  <ion-toolbar>
    <ion-title>Mis tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="task-form">
    <ion-item>
      <ion-input
        [(ngModel)]="newTaskTitle"
        label="Nueva tarea"
        label-placement="stacked"
        placeholder="Escribe una tarea">
      </ion-input>
    </ion-item>
  
    <ion-button expand="block" (click)="addTask()">
      Agregar tarea
    </ion-button>
  </div>

  <ion-list>
    @for (task of tasks(); track task.id) {
      <ion-item>
        <ion-label>
          <h2>{{ task.title }}</h2>

          <p>
            {{ task.completed ? 'Completada' : 'Pendiente' }}
          </p>
        </ion-label>

        <ion-button
          slot="end"
          fill="clear"
          (click)="toggleTask(task.id)">
          {{ task.completed ? 'Desmarcar' : 'Completar' }}
        </ion-button>

        <ion-button
          slot="end"
          fill="clear"
          color="danger"
          (click)="deleteTask(task.id)">
          Eliminar
        </ion-button>
      </ion-item>
    }
  </ion-list>
</ion-content>
